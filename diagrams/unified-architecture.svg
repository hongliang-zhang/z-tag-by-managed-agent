<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1320" viewBox="0 0 1600 1320" role="img" aria-labelledby="title desc">
  <title id="title">Z Tag by GLM Managed Agent 统一架构图</title>
  <desc id="desc">展示团队渠道、Z Tag 增量产品层、GLM Managed Agent 执行底座及企业系统之间的关系。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <marker id="arrowDark" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
    <style>
      .font { font-family: Inter, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
      .title { font-size: 36px; font-weight: 720; fill: #0f172a; }
      .subtitle { font-size: 17px; fill: #64748b; }
      .layer-title { font-size: 22px; font-weight: 700; }
      .layer-note { font-size: 15px; font-weight: 500; }
      .card-title { font-size: 18px; font-weight: 700; fill: #0f172a; }
      .card-text { font-size: 14px; fill: #475569; }
      .small { font-size: 13px; fill: #64748b; }
      .pill { font-size: 13px; font-weight: 650; }
    </style>
  </defs>

  <rect width="1600" height="1320" fill="#f8fafc"/>

  <g class="font">
    <text x="80" y="72" class="title">Z Tag by GLM Managed Agent｜统一产品与技术架构</text>
    <text x="80" y="105" class="subtitle">团队协作产品层承接组织语义与治理，Managed Agent 底座负责可靠执行</text>

    <g transform="translate(1120 50)">
      <rect x="0" y="0" width="112" height="30" rx="15" fill="#fff7ed" stroke="#fdba74"/>
      <circle cx="17" cy="15" r="6" fill="#f97316"/>
      <text x="31" y="20" class="pill" fill="#c2410c">需要补建</text>
      <rect x="124" y="0" width="112" height="30" rx="15" fill="#eff6ff" stroke="#93c5fd"/>
      <circle cx="141" cy="15" r="6" fill="#3b82f6"/>
      <text x="155" y="20" class="pill" fill="#1d4ed8">底座复用</text>
      <rect x="248" y="0" width="132" height="30" rx="15" fill="#fef2f2" stroke="#fca5a5"/>
      <circle cx="265" cy="15" r="6" fill="#ef4444"/>
      <text x="279" y="20" class="pill" fill="#b91c1c">权限控制点</text>
    </g>

    <!-- Channel layer -->
    <g filter="url(#shadow)">
      <rect x="80" y="145" width="1440" height="112" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    </g>
    <rect x="104" y="169" width="164" height="64" rx="14" fill="#f1f5f9"/>
    <text x="128" y="194" class="card-title">团队入口</text>
    <text x="128" y="217" class="small">成员 · 管理员</text>
    <line x1="294" y1="177" x2="294" y2="225" stroke="#e2e8f0" stroke-width="2"/>
    <text x="330" y="193" class="card-title">Slack · 飞书 · Teams</text>
    <text x="330" y="218" class="card-text">@Mention　Thread　DM　Assistant Panel　Channel Event</text>
    <rect x="1210" y="174" width="274" height="54" rx="13" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="1232" y="198" class="small">主交互单元</text>
    <text x="1232" y="219" class="card-title">Channel + Thread</text>

    <line x1="800" y1="258" x2="800" y2="292" stroke="#475569" stroke-width="2.5" marker-end="url(#arrowDark)"/>

    <!-- Z Tag layer -->
    <rect x="80" y="300" width="1440" height="470" rx="26" fill="#fffaf5" stroke="#fb923c" stroke-width="2"/>
    <rect x="104" y="322" width="306" height="39" rx="19.5" fill="#ffedd5"/>
    <text x="124" y="348" class="layer-title" fill="#c2410c">Z Tag 团队级产品层</text>
    <text x="427" y="347" class="layer-note" fill="#9a3412">Managed Agent 外需要补建</text>

    <!-- Orange cards row 1 -->
    <g filter="url(#shadow)">
      <rect x="108" y="382" width="424" height="132" rx="18" fill="#ffffff" stroke="#fed7aa"/>
      <rect x="588" y="382" width="424" height="132" rx="18" fill="#ffffff" stroke="#fed7aa"/>
      <rect x="1068" y="382" width="424" height="132" rx="18" fill="#ffffff" stroke="#fed7aa"/>
    </g>
    <circle cx="140" cy="414" r="16" fill="#ffedd5"/><text x="135" y="420" class="pill" fill="#c2410c">1</text>
    <text x="168" y="420" class="card-title">渠道接入与多人协作</text>
    <text x="132" y="452" class="card-text">Event Gateway · Thread ↔ Session Router</text>
    <text x="132" y="477" class="card-text">多人 Steering · Checklist · 状态与结果回帖</text>
    <text x="132" y="500" class="small">统一事件、幂等去重、乱序与失败补偿</text>

    <circle cx="620" cy="414" r="16" fill="#ffedd5"/><text x="615" y="420" class="pill" fill="#c2410c">2</text>
    <text x="648" y="420" class="card-title">Agent Profile 与 Scope</text>
    <text x="612" y="452" class="card-text">组织 → Workspace → Channel</text>
    <text x="612" y="477" class="card-text">模型 · 指令 · Skill · 环境 · 配置继承/覆盖</text>
    <text x="612" y="500" class="small">每次运行保存有效配置版本快照</text>

    <circle cx="1100" cy="414" r="16" fill="#ffedd5"/><text x="1095" y="420" class="pill" fill="#c2410c">3</text>
    <text x="1128" y="420" class="card-title">团队上下文与记忆</text>
    <text x="1092" y="452" class="card-text">Thread / 频道历史 · Workspace 搜索 · 文件</text>
    <text x="1092" y="477" class="card-text">公共记忆 · 私有频道隔离 · 来源与版本治理</text>
    <text x="1092" y="500" class="small">Session、Memory、Skill / 知识库相互解耦</text>

    <!-- Orange cards row 2 -->
    <g filter="url(#shadow)">
      <rect x="108" y="546" width="424" height="166" rx="18" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
      <rect x="588" y="546" width="424" height="166" rx="18" fill="#ffffff" stroke="#fed7aa"/>
      <rect x="1068" y="546" width="424" height="166" rx="18" fill="#ffffff" stroke="#fed7aa"/>
    </g>
    <circle cx="140" cy="578" r="16" fill="#fee2e2"/><text x="135" y="584" class="pill" fill="#b91c1c">4</text>
    <text x="168" y="584" class="card-title">身份、权限与凭证</text>
    <text x="132" y="616" class="card-text">Team Agent Identity · Access Bundle</text>
    <text x="132" y="641" class="card-text">Credential / Policy Gateway · 动态凭证注入</text>
    <rect x="132" y="658" width="367" height="33" rx="9" fill="#fef2f2"/>
    <text x="146" y="680" class="small" fill="#b91c1c">敏感操作：请求者权限校验或即时审批</text>

    <circle cx="620" cy="578" r="16" fill="#ffedd5"/><text x="615" y="584" class="pill" fill="#c2410c">5</text>
    <text x="648" y="584" class="card-title">Proactivity / Routines</text>
    <text x="612" y="616" class="card-text">Cron · Channel Watch · PR / Webhook 事件</text>
    <text x="612" y="641" class="card-text">持续跟进 · 主动 @人 · 周期汇报</text>
    <text x="612" y="672" class="small">沿用频道的权限、记忆、预算与审计归属</text>

    <circle cx="1100" cy="578" r="16" fill="#ffedd5"/><text x="1095" y="584" class="pill" fill="#c2410c">6</text>
    <text x="1128" y="584" class="card-title">企业治理与商业化</text>
    <text x="1092" y="616" class="card-text">RBAC · 外部频道策略 · Audit · 数据保留</text>
    <text x="1092" y="641" class="card-text">Org / Channel 限额 · 告警 · 用量与成本分析</text>
    <text x="1092" y="672" class="small">人 → 消息 → Session → Tool → 外部对象全链路</text>

    <line x1="800" y1="770" x2="800" y2="804" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
    <text x="822" y="792" class="small" fill="#c2410c">Create / Steer Session</text>

    <!-- Managed Agent layer -->
    <rect x="80" y="812" width="1440" height="314" rx="26" fill="#f5f9ff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="104" y="834" width="340" height="39" rx="19.5" fill="#dbeafe"/>
    <text x="124" y="860" class="layer-title" fill="#1d4ed8">GLM Managed Agent</text>
    <text x="457" y="859" class="layer-note" fill="#1e40af">复用执行底座</text>

    <g filter="url(#shadow)">
      <rect x="108" y="897" width="312" height="174" rx="18" fill="#ffffff" stroke="#bfdbfe"/>
      <rect x="456" y="897" width="312" height="174" rx="18" fill="#ffffff" stroke="#bfdbfe"/>
      <rect x="804" y="897" width="312" height="174" rx="18" fill="#ffffff" stroke="#bfdbfe"/>
      <rect x="1152" y="897" width="340" height="174" rx="18" fill="#ffffff" stroke="#bfdbfe"/>
    </g>

    <text x="132" y="932" class="card-title">Agent 定义与版本</text>
    <text x="132" y="966" class="card-text">Model · Prompt</text>
    <text x="132" y="991" class="card-text">Tools / MCP · Skills</text>
    <text x="132" y="1016" class="card-text">Multi-agent · Version</text>
    <rect x="132" y="1034" width="114" height="24" rx="12" fill="#dbeafe"/><text x="147" y="1051" class="small" fill="#1d4ed8">Agent Control</text>

    <text x="480" y="932" class="card-title">Session 与 Agent Loop</text>
    <text x="480" y="966" class="card-text">Async Run · Event Stream</text>
    <text x="480" y="991" class="card-text">Steer · Interrupt</text>
    <text x="480" y="1016" class="card-text">Session Budget</text>
    <rect x="480" y="1034" width="112" height="24" rx="12" fill="#dbeafe"/><text x="495" y="1051" class="small" fill="#1d4ed8">Long-running</text>

    <text x="828" y="932" class="card-title">Environment 与产物</text>
    <text x="828" y="966" class="card-text">Sandbox · Bash · Files</text>
    <text x="828" y="991" class="card-text">Web · Code Execution</text>
    <text x="828" y="1016" class="card-text">Artifact · Structured Output</text>
    <rect x="828" y="1034" width="105" height="24" rx="12" fill="#dbeafe"/><text x="843" y="1051" class="small" fill="#1d4ed8">Isolated Run</text>

    <text x="1176" y="932" class="card-title">运行基础设施</text>
    <text x="1176" y="966" class="card-text">Memory Store · Vault</text>
    <text x="1176" y="991" class="card-text">Cron / Scheduled Deployment</text>
    <text x="1176" y="1016" class="card-text">Trace · Outcome · Eval</text>
    <rect x="1176" y="1034" width="125" height="24" rx="12" fill="#dbeafe"/><text x="1191" y="1051" class="small" fill="#1d4ed8">Runtime Infra</text>

    <!-- Return loop -->
    <path d="M 1480 940 C 1550 900, 1550 730, 1506 690" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrowDark)"/>
    <rect x="1410" y="770" width="148" height="55" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1428" y="794" class="small">回传渠道</text>
    <text x="1428" y="815" class="small">进度 · 确认 · 结果</text>

    <line x1="800" y1="1126" x2="800" y2="1158" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrowDark)"/>
    <rect x="824" y="1132" width="202" height="25" rx="12.5" fill="#fef2f2" stroke="#fecaca"/>
    <text x="840" y="1150" class="small" fill="#b91c1c">via Credential / Policy Gateway</text>

    <!-- Enterprise systems -->
    <g filter="url(#shadow)">
      <rect x="80" y="1166" width="1440" height="105" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    </g>
    <rect x="104" y="1189" width="233" height="59" rx="14" fill="#f1f5f9"/>
    <text x="128" y="1214" class="card-title">企业数据与业务系统</text>
    <text x="128" y="1237" class="small">受控访问目标</text>

    <rect x="377" y="1189" width="260" height="59" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="401" y="1214" class="card-title">GitHub / GitLab</text>
    <text x="401" y="1237" class="small">代码 · Issue · PR · CI</text>

    <rect x="669" y="1189" width="310" height="59" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="693" y="1214" class="card-title">文档 / CRM / 数据仓库</text>
    <text x="693" y="1237" class="small">知识 · 客户 · 指标</text>

    <rect x="1011" y="1189" width="300" height="59" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="1035" y="1214" class="card-title">工单 / 监控 / 业务 API</text>
    <text x="1035" y="1237" class="small">执行 · 订阅 · Webhook</text>

    <rect x="1339" y="1189" width="157" height="59" rx="14" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="1361" y="1214" class="small" fill="#b91c1c">出口控制</text>
    <text x="1361" y="1237" class="small" fill="#b91c1c">默认拒绝</text>

    <text x="80" y="1302" class="subtitle">产品边界：Z Tag 管团队协作、身份权限与治理；GLM Managed Agent 管任务执行、环境与运行基础设施。</text>
  </g>
</svg>
