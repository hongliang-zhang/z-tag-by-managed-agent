<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" role="img" aria-labelledby="title desc">
  <title id="title">Z Tag by GLM Managed Agent 统一产品与技术架构</title>
  <desc id="desc">展示团队渠道、Scope Graph、Access Bundle、Effective Config Resolver、Thread Session 与 GLM Managed Agent 执行底座的关系。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
    <style>
      .font { font-family: Inter, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
      .title { font-size: 36px; font-weight: 720; fill: #0f172a; }
      .subtitle { font-size: 17px; fill: #64748b; }
      .layer-title { font-size: 22px; font-weight: 700; }
      .layer-note { font-size: 15px; font-weight: 500; }
      .card-title { font-size: 18px; font-weight: 700; fill: #0f172a; }
      .card-text { font-size: 14px; fill: #475569; }
      .small { font-size: 13px; fill: #64748b; }
      .pill { font-size: 13px; font-weight: 650; }
      .step { font-size: 14px; font-weight: 750; }
    </style>
  </defs>

  <rect width="1600" height="1600" fill="#f8fafc"/>

  <g class="font">
    <text x="80" y="70" class="title">Z Tag by GLM Managed Agent｜统一产品与技术架构</text>
    <text x="80" y="104" class="subtitle">一个组织级 Agent 解析 Scope 与能力包；Thread 可协作，Web Session 只读；预算与 Memory 使用独立边界</text>

    <g transform="translate(1122 47)">
      <rect x="0" y="0" width="112" height="30" rx="15" fill="#fff7ed" stroke="#fdba74"/>
      <circle cx="17" cy="15" r="6" fill="#f97316"/>
      <text x="31" y="20" class="pill" fill="#c2410c">需要补建</text>
      <rect x="124" y="0" width="112" height="30" rx="15" fill="#eff6ff" stroke="#93c5fd"/>
      <circle cx="141" cy="15" r="6" fill="#3b82f6"/>
      <text x="155" y="20" class="pill" fill="#1d4ed8">底座复用</text>
      <rect x="248" y="0" width="132" height="30" rx="15" fill="#fef2f2" stroke="#fca5a5"/>
      <circle cx="265" cy="15" r="6" fill="#ef4444"/>
      <text x="279" y="20" class="pill" fill="#b91c1c">权限控制点</text>
    </g>

    <!-- Channel surface -->
    <g filter="url(#shadow)">
      <rect x="80" y="142" width="1440" height="112" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    </g>
    <rect x="104" y="166" width="186" height="64" rx="14" fill="#f1f5f9"/>
    <text x="128" y="191" class="card-title">团队与管理入口</text>
    <text x="128" y="215" class="small">成员 · Owner · Admin</text>
    <line x1="316" y1="174" x2="316" y2="222" stroke="#e2e8f0" stroke-width="2"/>
    <text x="352" y="190" class="card-title">Slack · 飞书 · Teams</text>
    <text x="352" y="216" class="card-text">Workspace　Channel　Thread　DM　@Mention　Ambient　Routine</text>
    <rect x="1192" y="171" width="292" height="54" rx="13" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="1214" y="195" class="small">运行协作边界</text>
    <text x="1214" y="217" class="card-title">Thread 协作 + 只读 Trace</text>

    <line x1="800" y1="255" x2="800" y2="286" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- Z Tag control plane -->
    <rect x="80" y="294" width="1440" height="658" rx="26" fill="#fffaf5" stroke="#fb923c" stroke-width="2"/>
    <rect x="104" y="316" width="346" height="39" rx="19.5" fill="#ffedd5"/>
    <text x="124" y="342" class="layer-title" fill="#c2410c">Z Tag 团队产品与控制面</text>
    <text x="468" y="341" class="layer-note" fill="#9a3412">Managed Agent 外补建</text>

    <!-- Row 1 -->
    <g filter="url(#shadow)">
      <rect x="108" y="382" width="424" height="156" rx="18" fill="#ffffff" stroke="#fed7aa"/>
      <rect x="588" y="382" width="424" height="156" rx="18" fill="#ffffff" stroke="#fed7aa"/>
      <rect x="1068" y="382" width="424" height="156" rx="18" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
    </g>

    <circle cx="140" cy="414" r="16" fill="#ffedd5"/><text x="135" y="420" class="step" fill="#c2410c">1</text>
    <text x="168" y="420" class="card-title">安装配对与 Channel Registry</text>
    <text x="132" y="454" class="card-text">Organization ↔ App Installation / Workspace</text>
    <text x="132" y="480" class="card-text">Channel ID · 公开/私有 · App Membership</text>
    <text x="132" y="509" class="small">渠道鉴权、连接码、成员与共享状态同步</text>

    <circle cx="620" cy="414" r="16" fill="#ffedd5"/><text x="615" y="420" class="step" fill="#c2410c">2</text>
    <text x="648" y="420" class="card-title">Scope Graph</text>
    <text x="612" y="454" class="card-text">Default Root → Workspace → Channel</text>
    <text x="612" y="480" class="card-text">Model · Environment · Version · Interaction Policy</text>
    <text x="612" y="509" class="small">频道不是独立 Agent，而是配置 Overlay</text>

    <circle cx="1100" cy="414" r="16" fill="#fee2e2"/><text x="1095" y="420" class="step" fill="#b91c1c">3</text>
    <text x="1128" y="420" class="card-title">Access Bundle + Identity Registry</text>
    <text x="1092" y="454" class="card-text">Credential · Repository · Domain</text>
    <text x="1092" y="480" class="card-text">Plugin · Bundle Instruction · Service Account</text>
    <text x="1092" y="509" class="small">组织级身份独立；Bundle 可多 Scope 绑定</text>

    <!-- relationship arrows row 1 to row 2 -->
    <path d="M800 538 L800 566 L320 566 L320 586" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrowOrange)"/>
    <path d="M1280 538 L1280 566 L320 566" fill="none" stroke="#ea580c" stroke-width="2"/>

    <!-- Row 2 -->
    <g filter="url(#shadow)">
      <rect x="108" y="590" width="424" height="166" rx="18" fill="#ffffff" stroke="#fed7aa"/>
      <rect x="588" y="590" width="424" height="166" rx="18" fill="#ffffff" stroke="#fed7aa"/>
      <rect x="1068" y="590" width="424" height="166" rx="18" fill="#ffffff" stroke="#fed7aa"/>
    </g>

    <circle cx="140" cy="622" r="16" fill="#ffedd5"/><text x="135" y="628" class="step" fill="#c2410c">4</text>
    <text x="168" y="628" class="card-title">Effective Config Resolver</text>
    <text x="132" y="662" class="card-text">标量覆盖 · 集合累加 · 指令有序拼接</text>
    <text x="132" y="688" class="card-text">同 Host Credential：Channel &gt; Workspace &gt; Root</text>
    <rect x="132" y="708" width="360" height="28" rx="8" fill="#fff7ed"/>
    <text x="146" y="727" class="small" fill="#c2410c">输出 SessionLaunchSpec + 来源 Scope 快照</text>

    <circle cx="620" cy="622" r="16" fill="#ffedd5"/><text x="615" y="628" class="step" fill="#c2410c">5</text>
    <text x="648" y="628" class="card-title">Thread–Session Bridge</text>
    <text x="612" y="662" class="card-text">Channel + Thread ↔ Managed Agent Session</text>
    <text x="612" y="688" class="card-text">多人 Steering · Checklist · 结果回帖</text>
    <text x="612" y="722" class="small">幂等、恢复、渠道呈现与只读 Trace 深链</text>

    <circle cx="1100" cy="622" r="16" fill="#ffedd5"/><text x="1095" y="628" class="step" fill="#c2410c">6</text>
    <text x="1128" y="628" class="card-title">Context &amp; Memory Topology</text>
    <text x="1092" y="662" class="card-text">Thread / 频道历史 · 文件 · Workspace 搜索</text>
    <text x="1092" y="688" class="card-text">Public Workspace Store · Private Channel Store</text>
    <text x="1092" y="722" class="small">Session、Memory、Skill / KB 相互解耦</text>

    <line x1="532" y1="674" x2="584" y2="674" stroke="#ea580c" stroke-width="2.2" marker-end="url(#arrowOrange)"/>
    <path d="M1068 674 L1018 674" fill="none" stroke="#ea580c" stroke-width="2.2" marker-end="url(#arrowOrange)"/>

    <!-- governance strip -->
    <rect x="108" y="790" width="1384" height="116" rx="18" fill="#ffffff" stroke="#fed7aa"/>
    <text x="136" y="824" class="card-title">治理与持续工作</text>
    <text x="136" y="854" class="card-text">Routine　·　Human→Agent RBAC　·　Agent→Resource Policy　·　Org/Channel Budget　·　Unified Audit　·　可靠性</text>
    <text x="136" y="880" class="small">预算不走 Workspace Scope；Network export 非完整审计；新 Thread 固化 SessionLaunchSpec 与来源</text>

    <line x1="800" y1="952" x2="800" y2="992" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
    <rect x="826" y="960" width="260" height="28" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="844" y="979" class="small" fill="#c2410c">Create / Steer Session + Context Pack</text>

    <!-- Managed Agent -->
    <rect x="80" y="1000" width="1440" height="318" rx="26" fill="#f5f9ff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="104" y="1022" width="340" height="39" rx="19.5" fill="#dbeafe"/>
    <text x="124" y="1048" class="layer-title" fill="#1d4ed8">GLM Managed Agent</text>
    <text x="457" y="1047" class="layer-note" fill="#1e40af">复用执行底座</text>

    <g filter="url(#shadow)">
      <rect x="108" y="1086" width="312" height="176" rx="18" fill="#ffffff" stroke="#bfdbfe"/>
      <rect x="456" y="1086" width="312" height="176" rx="18" fill="#ffffff" stroke="#bfdbfe"/>
      <rect x="804" y="1086" width="312" height="176" rx="18" fill="#ffffff" stroke="#bfdbfe"/>
      <rect x="1152" y="1086" width="340" height="176" rx="18" fill="#ffffff" stroke="#bfdbfe"/>
    </g>

    <text x="132" y="1121" class="card-title">Agent Definition</text>
    <text x="132" y="1155" class="card-text">Model · Prompt</text>
    <text x="132" y="1181" class="card-text">Tools / MCP · Skills</text>
    <text x="132" y="1207" class="card-text">Version · Multi-agent</text>
    <rect x="132" y="1224" width="106" height="24" rx="12" fill="#dbeafe"/><text x="147" y="1241" class="small" fill="#1d4ed8">Definition</text>

    <text x="480" y="1121" class="card-title">Session &amp; Agent Loop</text>
    <text x="480" y="1155" class="card-text">Async · Event Stream</text>
    <text x="480" y="1181" class="card-text">Steer · Interrupt</text>
    <text x="480" y="1207" class="card-text">Session Budget</text>
    <rect x="480" y="1224" width="116" height="24" rx="12" fill="#dbeafe"/><text x="495" y="1241" class="small" fill="#1d4ed8">Long-running</text>

    <text x="828" y="1121" class="card-title">Environment / Sandbox</text>
    <text x="828" y="1155" class="card-text">Bash · Files · Web</text>
    <text x="828" y="1181" class="card-text">Code Execution</text>
    <text x="828" y="1207" class="card-text">Artifact · Output</text>
    <rect x="828" y="1224" width="105" height="24" rx="12" fill="#dbeafe"/><text x="843" y="1241" class="small" fill="#1d4ed8">Isolated Run</text>

    <text x="1176" y="1121" class="card-title">Runtime Primitives</text>
    <text x="1176" y="1155" class="card-text">Memory Store · Vault</text>
    <text x="1176" y="1181" class="card-text">Cron / Webhook</text>
    <text x="1176" y="1207" class="card-text">Trace · Outcome / Eval</text>
    <rect x="1176" y="1224" width="118" height="24" rx="12" fill="#dbeafe"/><text x="1191" y="1241" class="small" fill="#1d4ed8">Runtime Infra</text>

    <!-- return loop -->
    <path d="M1480 1142 L1540 1142 L1540 774 L800 774 L800 756" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
    <rect x="1394" y="932" width="160" height="56" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1412" y="956" class="small">回传原 Thread</text>
    <text x="1412" y="978" class="small">进度 · 确认 · 结果</text>

    <!-- Policy gateway -->
    <line x1="800" y1="1318" x2="800" y2="1344" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="196" y="1352" width="1208" height="82" rx="18" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="224" y="1382" class="card-title" fill="#991b1b">Credential / Policy Gateway｜权限控制点</text>
    <text x="224" y="1410" class="card-text">Host · Path · Method · Credential Route · Approval　｜　网络边界动态注入，Credential 不进入模型与 Sandbox，未命中规则默认拒绝</text>

    <line x1="800" y1="1434" x2="800" y2="1460" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- External systems -->
    <g filter="url(#shadow)">
      <rect x="80" y="1468" width="1440" height="92" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    </g>
    <text x="112" y="1504" class="card-title">企业数据与业务系统</text>
    <text x="112" y="1532" class="small">受控访问目标</text>
    <text x="400" y="1511" class="card-title">GitHub / GitLab</text>
    <text x="688" y="1511" class="card-title">文档 / CRM / 数据仓库</text>
    <text x="1086" y="1511" class="card-title">工单 / 监控 / 业务 API</text>

    <text x="80" y="1588" class="subtitle">产品边界：Z Tag 编译团队 Scope、身份、能力与上下文；Managed Agent 执行；Slack Thread 才能继续指导。</text>
  </g>
</svg>
